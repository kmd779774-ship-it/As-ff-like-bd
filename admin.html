<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS LIKE BOT • Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#08090d;--card:#12151c;--line:#282d39;--p:#7c5cff;--text:#f6f7fb;--muted:#9ba2b2}*{box-sizing:border-box}body{margin:0;background:#08090d;color:var(--text);font-family:Inter,'Noto Sans Bengali',sans-serif}.wrap{width:min(100% - 24px,1050px);margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:11px}.section{margin-top:18px}.input{width:100%;background:#0c0e13;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}.btn{border:0;background:var(--p);color:#fff;padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer}.row{display:flex;gap:8px}.row>*{flex:1}.pkg{display:grid;grid-template-columns:1fr 120px;gap:8px;margin:8px 0}.table{overflow:auto;margin-top:10px}.table table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{border-bottom:1px solid var(--line);padding:10px;text-align:left;white-space:nowrap}.ok{color:#6cf3a1}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">𝐀𝐒 𝐋𝐈𝐊𝐄 𝐁𝐎𝐓 — ADMIN<small>Developer • ARYAN SHANTO • No login test panel</small></div><a class="btn" href="/">Open Store</a></div><div id="stats" class="grid"></div><div class="section card"><h3>Site Settings</h3><input id="siteName" class="input" placeholder="Site name"><input id="notice" class="input" placeholder="Notice"><input id="banner" class="input" placeholder="Banner image URL"><input id="telegram" class="input" placeholder="Telegram URL"><button class="btn" onclick="saveSite()">Save Site</button></div><div class="section card"><h3>Like Packages</h3><div id="packages"></div><button class="btn" onclick="addPackage()">+ Add Package</button> <button class="btn" onclick="savePackages()">Save Packages</button></div><div class="section card"><h3>Recent Orders</h3><div id="orders" class="table"></div></div></main><script>let cfg={};async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}async function load(){cfg=await api('/api/admin/stats');document.getElementById('stats').innerHTML=[['Users',cfg.users],['Orders',cfg.orders],['Payments',cfg.payments],['Executed',cfg.revenue+' BDT']].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');const s=cfg.site||{};siteName.value=s.name||'';notice.value=s.notice||'';banner.value=s.banner||'';telegram.value=s.telegram||'';render();const rows=await api('/api/admin/orders');orders.innerHTML='<table><tr><th>ID</th><th>UID</th><th>Likes</th><th>Price</th><th>Status</th></tr>'+rows.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.uid)}</td><td>${o.likes}</td><td>৳ ${o.price}</td><td>${esc(o.status)}</td></tr>`).join('')+'</table>'}function render(){packages.innerHTML=(cfg.packages||[]).map((p,i)=>`<div class="pkg"><input class="input likes" value="${p.likes}" data-i="${i}" type="number"><input class="input prices" value="${p.price}" data-i="${i}" type="number"></div>`).join('')}function addPackage(){cfg.packages.push({likes:100,price:5});render()}async function savePackages(){const a=[...document.querySelectorAll('.likes')].map((x,i)=>({likes:Number(x.value),price:Number(document.querySelectorAll('.prices')[i].value)})).filter(x=>x.likes>0&&x.price>=0);await api('/api/admin/settings',{method:'POST',body:JSON.stringify({packages:a})});cfg.packages=a;render();alert('Packages saved')}async function saveSite(){const site={name:siteName.value,notice:notice.value,banner:banner.value,telegram:telegram.value,developer:'ARYAN SHANTO'};await api('/api/admin/settings',{method:'POST',body:JSON.stringify({site}));alert('Site saved')}load().catch(e=>alert(e.message));</script></body></html>
